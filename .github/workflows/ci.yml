name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:

    - uses: actions/checkout@v6

    - name: Set environment variables
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Dependency packages (apt)
      run: |
        sudo apt update
        sudo apt -y install git gcc-arm-none-eabi python3-pip srecord stm32flash zip unzip wget libncurses-dev

    - name: Dependency packages (pip)
      run: python3 -m pip install --user crcmod intelhex

    - name: Tests
      run: make -j4 tests

    - name: Build dist
      run: |
        export VER=${{ steps.vars.outputs.sha_short }}
        make -j4 dist VER=$VER
        mkdir -p _cidist
        mv out/flashfloppy-$VER .
        rm flashfloppy-$VER/RELEASE_NOTES
        git rev-parse HEAD >flashfloppy-$VER/COMMIT
        zip -r flashfloppy-$VER.zip flashfloppy-$VER
        mv flashfloppy-$VER.zip _cidist/

    - name: Build debug dist
      run: |
        export VER=${{ steps.vars.outputs.sha_short }}-debug
        make -j4 dist VER=$VER level=debug
        mv out/flashfloppy-$VER .
        rm flashfloppy-$VER/RELEASE_NOTES
        git rev-parse HEAD >flashfloppy-$VER/COMMIT
        echo debug >>flashfloppy-$VER/COMMIT
        zip -r flashfloppy-$VER.zip flashfloppy-$VER
        mv flashfloppy-$VER.zip _cidist/

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: flashfloppy-ci-${{ steps.vars.outputs.sha_short }}
        path: _cidist

  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: Keep LF line endings in checkout
      shell: pwsh
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v6

    - name: Dependency packages (MSYS2)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        install: git gcc make ncurses-devel python mintty

    - name: Set environment variables
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Tests
      run: make -j4 tests

    - name: Build Windows pack
      run: |
        export VER=${{ steps.vars.outputs.sha_short }}
        mkdir -p _cidist
        ffemu/win/mk_dist.sh out _cidist/ffemu-win64-$VER

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ffemu-win64-ci-${{ steps.vars.outputs.sha_short }}
        path: _cidist
